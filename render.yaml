# Render blueprint — the whole application is one service. There is no separate
# frontend and backend to split: the pages, the business rules and the two HTTP
# endpoints are one Next.js deployment.
#
# Starting on the free plan. Two things to know about it:
#
#   1. A free service sleeps after 15 minutes of inactivity, and the next
#      request waits roughly a minute while it wakes. Fine for testing and UAT,
#      not fine once staff use it daily — change `plan` to `starter` then.
#   2. Render's scheduled jobs are a paid service type, so the free plan runs no
#      cron. The scheduler lives in .github/workflows/scheduled-jobs.yml
#      instead. On a paid plan, prefer Render cron: see the commented block at
#      the bottom of this file.
#
# Set the six secrets in the Render dashboard, never in this file.

services:
  - type: web
    name: three-percent-club-crm
    runtime: node
    plan: free
    # Render has no India region; Singapore is the closest to the Mumbai
    # database. Keep the two as close as the platform allows.
    region: singapore
    # migrate deploy applies only pending migrations and never resets data. It
    # runs before the build so a deploy can never serve code against a schema
    # that has not caught up. It uses DIRECT_URL, which bypasses the pooler.
    # The node -e prints only the host, never the password. It is here because a
    # stale DIRECT_URL is invisible otherwise: migrate deploy names the host it
    # failed on, but not which variable the value came from.
    buildCommand: npm ci && node -e "console.log('DIRECT_URL host ->', new URL(process.env.DIRECT_URL).host)" && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      # Must be the session-mode pooler on port 5432:
      #   postgresql://postgres.<ref>:<pw>@aws-0-ap-south-1.pooler.supabase.com:5432/postgres
      # NOT db.<ref>.supabase.co:5432 — that host resolves to IPv6 only and
      # Render has no IPv6 outbound, so migrate deploy fails with P1001. Port
      # 6543 is transaction mode and cannot run migrations; 5432 on the same
      # pooler host is session mode and can.
      - key: DIRECT_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: SENSITIVE_KEY
        sync: false
      - key: BLIND_INDEX_KEY
        sync: false
      - key: JOBS_SECRET
        sync: false
      # Render terminates TLS in front of the app and sets X-Forwarded-For.
      - key: TRUST_PROXY
        value: "true"
      # Never set ALLOW_CHECK_WRITES here. The check scripts write and delete
      # tagged data; they must never point at production.

